version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - bodyclose
    - gosec
    - misspell
    - unconvert
  exclusions:
    rules:
      # Test files intentionally ignore some errors (e.g. deferred Close in
      # setup/teardown) and use fixture data that trips gosec's weak-crypto
      # and hardcoded-credential heuristics.
      - path: _test\.go
        linters:
          - errcheck
          - gosec

formatters:
  enable:
    - gofmt
    - goimports
