<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-label="The Forge: run language models, the Radiance engine and live speech-to-speech on your own AMD Strix Halo machine">
  <title>The Forge</title>
  <desc>Local AI on one machine: language models with llama.cpp, mixed-precision models with Radiance, and full-duplex speech-to-speech, where you and the model can talk at the same time.</desc>

  <defs>
    <linearGradient id="ember" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
  </defs>

  <rect x="0.75" y="0.75" width="1198.5" height="398.5" rx="16" fill="#101318" stroke="#232b38" stroke-width="1.5"/>

  <text x="56" y="64" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" letter-spacing="2" fill="#f59e0b">LOCAL AI ON AMD STRIX HALO</text>
  <text x="54" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="86" font-weight="700" fill="#f4f1ea">The Forge</text>
  <text x="56" y="200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="30" fill="#c7cdd6">Language models and live voice,</text>
  <text x="56" y="238" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="30" fill="#c7cdd6">on your own machine.</text>

  <!-- the three things it runs -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="600">
    <rect x="56" y="296" width="220" height="56" rx="28" fill="#1c232e" stroke="#f59e0b" stroke-width="2.5"/>
    <text x="166" y="332" text-anchor="middle" fill="#fde68a">Radiance</text>
    <rect x="296" y="296" width="270" height="56" rx="28" fill="#1c232e" stroke="#f59e0b" stroke-width="2.5"/>
    <text x="431" y="332" text-anchor="middle" fill="#fde68a">Speech-to-speech</text>
    <rect x="586" y="296" width="180" height="56" rx="28" fill="#1c232e" stroke="#7b8794" stroke-width="2"/>
    <text x="676" y="332" text-anchor="middle" fill="#e8e6e1">llama.cpp</text>
  </g>

  <!-- motif: two voices at once, over a forge anvil -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M770 108 H800 L814 84 L832 134 L850 66 L870 146 L888 90 L904 124 L918 108 H1090" stroke="url(#ember)" stroke-width="5"/>
    <path d="M1090 94 L1114 108 L1090 122" stroke="#fde68a" stroke-width="5"/>
    <path d="M1118 168 H1030 L1016 148 L998 190 L980 136 L962 200 L944 152 L928 182 L914 168 H794" stroke="#7b8794" stroke-width="5"/>
    <path d="M794 154 L770 168 L794 182" stroke="#7b8794" stroke-width="5"/>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#7f8794">
    <text x="770" y="56">you speak</text>
    <text x="1118" y="224" text-anchor="end">it speaks, at the same time</text>
  </g>

  <!-- anvil -->
  <g>
    <path d="M900 346 L930 300 H1010 L1040 346 Z" fill="#1c232e" stroke="#7b8794" stroke-width="3"/>
    <path d="M930 305 Q892 303 862 298" stroke="#7b8794" stroke-width="10" fill="none" stroke-linecap="round"/>
    <rect x="936" y="346" width="68" height="16" rx="3" fill="#1c232e" stroke="#7b8794" stroke-width="2.5"/>
    <rect x="938" y="286" width="64" height="14" rx="4" fill="url(#ember)"/>
    <circle cx="1022" cy="276" r="4" fill="#f59e0b"/>
    <circle cx="1042" cy="258" r="3" fill="#fbbf24"/>
    <circle cx="920" cy="262" r="2.5" fill="#fbbf24"/>
  </g>
</svg>
