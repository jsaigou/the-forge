<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-label="How The Forge fits together: your apps talk to the Forge, which runs llama.cpp, Radiance and speech engines on your GPU">
  <title>How The Forge fits together</title>
  <desc>Apps and agents use one OpenAI-compatible address. The browser console manages models. The Forge decides what to load into GPU memory: llama.cpp models, Radiance models, and speech engines.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#7b8794"/>
    </marker>
  </defs>
  <rect x="0.75" y="0.75" width="1198.5" height="428.5" rx="16" fill="#101318" stroke="#232b38" stroke-width="1.5"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" letter-spacing="1.5">
    <text x="48" y="48" fill="#7f8794">YOU</text>
    <text x="420" y="48" fill="#f59e0b">THE FORGE</text>
    <text x="852" y="48" fill="#7f8794">ON YOUR GPU</text>
  </g>

  <g fill="#1c232e" stroke="#7b8794" stroke-width="2">
    <rect x="40" y="78" width="280" height="86" rx="10"/>
    <rect x="40" y="182" width="280" height="86" rx="10"/>
    <rect x="40" y="286" width="280" height="86" rx="10"/>
  </g>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" text-anchor="middle">
    <g font-size="24" font-weight="600" fill="#e8e6e1">
      <text x="180" y="116">Apps and agents</text>
      <text x="180" y="220">Web console</text>
      <text x="180" y="324">Your voice</text>
    </g>
    <g font-size="20" fill="#9aa3af">
      <text x="180" y="146">OpenAI API or MCP</text>
      <text x="180" y="250">add, load, watch</text>
      <text x="180" y="354">talk-studio (set up by hand)</text>
    </g>
  </g>

  <rect x="400" y="70" width="380" height="314" rx="12" fill="none" stroke="#f59e0b" stroke-width="2"/>
  <g fill="#1c232e" stroke="#e8e6e1" stroke-width="2">
    <rect x="424" y="94" width="332" height="60" rx="8"/>
    <rect x="424" y="197" width="332" height="60" rx="8"/>
    <rect x="424" y="300" width="332" height="60" rx="8"/>
  </g>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" text-anchor="middle" fill="#e8e6e1">
    <text x="590" y="131">Router, port 8085</text>
    <text x="590" y="234">Scheduler: what fits, what goes</text>
    <text x="590" y="337">forge-duplex, port 8086</text>
  </g>

  <g fill="#1c232e" stroke-width="2.5">
    <rect x="860" y="78" width="300" height="86" rx="10" stroke="#7b8794"/>
    <rect x="860" y="182" width="300" height="86" rx="10" stroke="#f59e0b"/>
    <rect x="860" y="286" width="300" height="86" rx="10" stroke="#f59e0b"/>
  </g>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" text-anchor="middle">
    <g font-size="24" font-weight="600">
      <text x="1010" y="116" fill="#e8e6e1">llama.cpp</text>
      <text x="1010" y="220" fill="#fde68a">Radiance</text>
      <text x="1010" y="324" fill="#fde68a">Speech-to-speech</text>
    </g>
    <g font-size="20" fill="#9aa3af">
      <text x="1010" y="146">GGUF models</text>
      <text x="1010" y="250">.rad models</text>
      <text x="1010" y="354">Haru, on Radiance</text>
    </g>
  </g>

  <g stroke="#7b8794" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M320 121 H422"/>
    <path d="M320 225 H422"/>
    <path d="M320 330 H422"/>
    <path d="M590 154 V195"/>
    <path d="M756 220 L858 130"/>
    <path d="M756 227 H858"/>
    <path d="M756 330 H858"/>
  </g>
</svg>
