# /etc/systemd/system/forge-pool@.service.d/90-kill-on-timeout.conf
# Why this is a drop-in and not a line in forge-pool@.service: Fedora ships /usr/lib/systemd/system/service.d/10-timeout-abort.conf, a drop-in for
# EVERY service that sets TimeoutStopFailureMode=abort, and a drop-in beats the unit file's own settings. A line in forge-pool@.service is silently
# ignored (found live 2026-11-03: the installed line read as set, systemctl show still said abort, and the stop still dumped core). A drop-in for this
# template does override the global one, BUT only if its file name sorts after it: systemd applies all drop-ins sorted by file NAME, whatever
# directory they are in, and the last one wins. Named 10-kill-on-timeout.conf it sorted before Fedora's 10-timeout-abort.conf and lost (found live
# 2026-11-03, second attempt: DropInPaths listed ours first and systemctl show still said abort). The 90- prefix sorts after it. Other services on the
# host are untouched.
#
# What it does: llama-server does not exit on SIGTERM while a request is in flight, so stopping a member that is mid-generation runs into
# TimeoutStopSec (60 s). With "abort" systemd sends SIGABRT at that point and the process dumps core (5 GB of llama-server cores had piled up in
# /var/lib/systemd/coredump). "kill" ends it with SIGKILL instead: no core, same wait. The wait itself is unchanged; a quicker stop would need the
# daemon to send a second SIGTERM (not done).
#
# Install (operator):
#   sudo mkdir -p /etc/systemd/system/forge-pool@.service.d
#   sudo cp systemd/forge-pool@.service.d/90-kill-on-timeout.conf /etc/systemd/system/forge-pool@.service.d/
#   sudo systemctl daemon-reload
# Check: systemctl show forge-pool@s7 -p TimeoutStopFailureMode   (must print kill)

[Service]
TimeoutStopFailureMode=kill
